name: Validate & Compile Blockchain Manifest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for committing changes back to repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Run Schema & Cryptographic Proof-of-Work Validation
      run: node scripts/build.js

    - name: Commit Compiled Blockchain Manifest
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update compiled members manifest [skip ci]"
        file_pattern: 'api/members.json'
